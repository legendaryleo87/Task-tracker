<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A free, open-source personal task tracker">
  <title>My Task Tracker</title>
  <style>
    /* 🎨 THEME & CUSTOMIZATION ZONE */
    :root {
      --bg: #f6f8fa;
      --card-bg: #ffffff;
      --primary: #2da44e;
      --primary-hover: #2c974b;
      --text: #1f2328;
      --text-muted: #656d76;
      --border: #d0d7de;
      --danger: #cf222e;
      --danger-hover: #a40e26;
      --radius: 8px;
      --shadow: 0 3px 6px rgba(0,0,0,0.08);
    }
    /* 👆 Change colors above to match your style */

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
    }
    .app {
      max-width: 600px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2rem;
    }
    header { text-align: center; margin-bottom: 1.5rem; }
    h1 { font-size: 1.8rem; margin-bottom: 0.25rem; }
    .subtitle { color: var(--text-muted); font-size: 0.95rem; }
    
    .controls { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; }
    input {
      flex: 1; padding: 0.6rem 1rem; border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 1rem; outline: none;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(45,164,78,0.2); }
    button {
      padding: 0.6rem 1.2rem; background: var(--primary); color: white;
      border: none; border-radius: var(--radius); font-size: 1rem;
      cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: var(--primary-hover); }
    .secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    .secondary:hover { background: var(--border); }

    ul { list-style: none; }
    li {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.75rem 0; border-bottom: 1px solid var(--border);
    }
    li:last-child { border-bottom: none; }
    .task-text { flex: 1; cursor: pointer; }
    .completed .task-text { text-decoration: line-through; color: var(--text-muted); }
    
    .delete-btn {
      background: transparent; color: var(--danger); padding: 0.4rem 0.6rem;
      font-size: 0.85rem;
    }
    .delete-btn:hover { background: rgba(207,34,46,0.1); color: var(--danger-hover); }
    
    .empty-state { text-align: center; color: var(--text-muted); margin-top: 1rem; display: none; }
    .footer { text-align: center; margin-top: 2rem; font-size: 0.85rem; color: var(--text-muted); }
    .footer a { color: var(--primary); text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>📋 Task Tracker</h1>
      <p class="subtitle">Organize your day, one task at a time.</p>
    </header>

    <section class="controls">
      <input type="text" id="taskInput" placeholder="What needs to be done?" aria-label="New task input">
      <button id="addBtn" type="button">Add Task</button>
    </section>

    <ul id="taskList" aria-live="polite"></ul>
    <p id="emptyState" class="empty-state">No tasks yet. Add one above to get started!</p>

    <div style="text-align:center; margin-top:1rem;">
      <button id="resetBtn" class="secondary" type="button">🗑️ Clear All</button>
    </div>

    <div class="footer">
      Built with vanilla HTML/CSS/JS • Data saves locally in your browser<br>
      Fork on GitHub • Share with friends • Customize freely
    </div>
  </main>

  <script>
    // 🔧 CONFIG ZONE
    const STORAGE_KEY = 'task_tracker_v1'; // Change to isolate data or reset
    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const resetBtn = document.getElementById('resetBtn');
    const taskList = document.getElementById('taskList');
    const emptyState = document.getElementById('emptyState');

    let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    function render() {
      taskList.innerHTML = '';
      emptyState.style.display = tasks.length === 0 ? 'block' : 'none';
      
      tasks.forEach((task, i) => {
        const li = document.createElement('li');
        li.className = task.completed ? 'completed' : '';
        li.innerHTML = `
          <input type="checkbox" ${task.completed ? 'checked' : ''} aria-label="Toggle task">
          <span class="task-text">${escapeHTML(task.text)}</span>
          <button class="delete-btn" aria-label="Delete task">✕</button>
        `;
        taskList.appendChild(li);
      });
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (!text) return;
      tasks.push({ text, completed: false });
      taskInput.value = '';
      save(); render();
    }

    function toggle(index) {
      tasks[index].completed = !tasks[index].completed;
      save(); render();
    }

    function remove(index) {
      tasks.splice(index, 1);
      save(); render();
    }

    function clearAll() {
      if (confirm('Delete all tasks? This cannot be undone.')) {
        tasks = []; save(); render();
      }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ⚡ EVENT LISTENERS
    addBtn.addEventListener('click', addTask);
    resetBtn.addEventListener('click', clearAll);
    taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

    taskList.addEventListener('click', e => {
      const li = e.target.closest('li');
      if (!li) return;
      const index = [...taskList.children].indexOf(li);
      if (e.target.matches('input[type="checkbox"]') || e.target.matches('.task-text')) toggle(index);
      else if (e.target.matches('.delete-btn')) remove(index);
    });

    // 🚀 INITIAL LOAD
    render();
  </script>
</body>
</html>
